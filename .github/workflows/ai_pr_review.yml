# .github/workflows/ai_pr_review.yml
name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write # To comment on the PR
  contents: read     # To read repo contents (standards, diff, script)

jobs:
  ai_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Or your preferred Python version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          # Ensure requirements file exists and is in the right place
          if [ -f .github/scripts/requirements.txt ]; then
            pip install -r .github/scripts/requirements.txt
          else
            echo "Error: .github/scripts/requirements.txt not found."
            exit 1
          fi

      - name: Get PR Metadata
        id: pr_metadata
        run: |
          DELIMITER_TITLE=$(openssl rand -hex 16)
          echo "pr_title<<$DELIMITER_TITLE" >> $GITHUB_OUTPUT
          echo "${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT
          echo "$DELIMITER_TITLE" >> $GITHUB_OUTPUT

          DELIMITER_DESC=$(openssl rand -hex 16)
          pr_desc="${{ github.event.pull_request.body }}"
          if [[ -z "$pr_desc" ]]; then
            pr_desc="No description provided."
          fi
          echo "pr_description<<$DELIMITER_DESC" >> $GITHUB_OUTPUT
          echo "$pr_desc" >> $GITHUB_OUTPUT
          echo "$DELIMITER_DESC" >> $GITHUB_OUTPUT

          echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

      - name: Get PR Diff
        id: pr_diff
        run: |
          DELIMITER_DIFF=$(openssl rand -hex 16)
          gh pr diff ${{ steps.pr_metadata.outputs.pr_number }} --repo ${{ github.repository }} > pr.diff || \
            echo "Failed to get diff using GitHub CLI." >&2

          if [ ! -s pr.diff ]; then
            echo "pr_diff_content=No changes detected or diff could not be retrieved." >> $GITHUB_OUTPUT
          else
            echo "pr_diff_content<<$DELIMITER_DIFF" >> $GITHUB_OUTPUT
            # Handle potential trailing newline issues with cat in this context
            cat pr.diff >> $GITHUB_OUTPUT
            echo "" >> $GITHUB_OUTPUT # Add a newline just in case cat doesn't
            echo "$DELIMITER_DIFF" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- CHANGE: Simplify Load Coding Standards ---
      - name: Check for Coding Standards File
        id: coding_standards
        run: |
          standards_file=".github/CODING_STANDARDS.md" # Adjust path if needed
          if [[ ! -f "$standards_file" ]]; then
             echo "::error::Coding standards file not found at $standards_file."
             exit 1 # Fail the job if standards file is mandatory and missing
          fi
          # No need to output content anymore
          echo "Standards file found at $standards_file"

      # --- CHANGE: Pass file path to script ---
      - name: Run AI Review Python Script
        id: run_script
        continue-on-error: true
        run: |
          # Define the path to the standards file
          STANDARDS_FILE_PATH=".github/CODING_STANDARDS.md"

          # Execute the python script, passing path instead of content
          python .github/scripts/ai_pr_review.py \
            --title "$PR_TITLE" \
            --description "$PR_DESCRIPTION" \
            --diff "$PR_DIFF_CONTENT" \
            --standards-file "$STANDARDS_FILE_PATH" \
            > review_output.txt # Capture stdout

          script_exit_code=$?
          if [ $script_exit_code -ne 0 ]; then
            echo "Python script failed with exit code $script_exit_code." >&2
            # Optionally display captured stderr if python script writes it
            # cat error_log.txt >&2
            exit 1
          fi

          # Save the script's stdout (the review comment) to GitHub Actions output
          DELIMITER_COMMENT=$(openssl rand -hex 16)
          echo "review_comment<<$DELIMITER_COMMENT" >> $GITHUB_OUTPUT
          if [[ -f "review_output.txt" ]]; then
             cat review_output.txt >> $GITHUB_OUTPUT
             echo "" >> $GITHUB_OUTPUT # Add trailing newline
          fi
          echo "$DELIMITER_COMMENT" >> $GITHUB_OUTPUT
        env:
          # GEMINI key is still needed by the script
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Pass other potentially multi-line outputs via env vars
          PR_TITLE: ${{ steps.pr_metadata.outputs.pr_title }}
          PR_DESCRIPTION: ${{ steps.pr_metadata.outputs.pr_description }}
          PR_DIFF_CONTENT: ${{ steps.pr_diff.outputs.pr_diff_content }}
          # CODING_STANDARDS env var is no longer needed here

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = ${{ steps.pr_metadata.outputs.pr_number }};
            const reviewComment = `${{ steps.run_script.outputs.review_comment }}`;
            const scriptOutcome = '${{ steps.run_script.outcome }}';

            let commentBody = '';

            if (scriptOutcome === 'failure') {
              commentBody = `⚠️ **AI Review Failed**\n\nCould not generate AI review. The review script encountered an error. Please check the workflow run logs for details.`;
            } else if (!reviewComment || reviewComment.trim() === '') {
              commentBody = `⚠️ **AI Review Warning**\n\nGemini API returned an empty response or the review script produced no output.`;
            } else {
              commentBody = `## 🤖 AI Pull Request Review\n\n${reviewComment}`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: commentBody
            });