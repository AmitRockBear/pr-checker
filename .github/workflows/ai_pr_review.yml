# .github/workflows/ai_pr_review.yml
name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write # To comment on the PR
  contents: read     # To read repo contents (standards, diff, script)

jobs:
  ai_review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' # Or your preferred Python version

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r .github/scripts/requirements.txt # Install from requirements file

      - name: Get PR Metadata
        id: pr_metadata
        run: |
          echo "pr_title<<EOF" >> $GITHUB_OUTPUT
          echo "${{ github.event.pull_request.title }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          pr_desc="${{ github.event.pull_request.body }}"
          if [[ -z "$pr_desc" ]]; then
            pr_desc="No description provided."
          fi
          echo "pr_description<<EOF" >> $GITHUB_OUTPUT
          echo "$pr_desc" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT

      - name: Get PR Diff
        id: pr_diff
        run: |
          gh pr diff ${{ steps.pr_metadata.outputs.pr_number }} --repo ${{ github.repository }} > pr.diff || \
            echo "Failed to get diff using GitHub CLI." >&2

          if [ ! -s pr.diff ]; then
            echo "pr_diff_content=No changes detected or diff could not be retrieved." >> $GITHUB_OUTPUT
          else
            echo "pr_diff_content<<EOF" >> $GITHUB_OUTPUT
            cat pr.diff >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Load Coding Standards
        id: coding_standards
        run: |
          standards_file=".github/CODING_STANDARDS.md" # Adjust path if needed
          if [[ -f "$standards_file" ]]; then
            echo "content<<EOF" >> $GITHUB_OUTPUT
            cat "$standards_file" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "content=Coding standards file not found at $standards_file." >> $GITHUB_OUTPUT
          fi

      - name: Run AI Review Python Script
        id: run_script # Give the step an ID to access its outcome/output
        continue-on-error: true # Allow workflow to proceed to commenting step even if script fails
        run: |
          # Execute the python script, passing data as arguments
          # Using environment variables for arguments helps handle multi-line content safely
          python .github/scripts/ai_pr_review.py \
            --title "$PR_TITLE" \
            --description "$PR_DESCRIPTION" \
            --diff "$PR_DIFF_CONTENT" \
            --standards "$CODING_STANDARDS" \
            > review_output.txt # Capture stdout to a file

          # Check the exit code of the python script
          if [ $? -ne 0 ]; then
            echo "Python script failed. Check stderr above." >&2
            # Optionally, output stderr if captured: cat error.log >&2
            # Make the step fail explicitly (though continue-on-error is set)
            exit 1
          fi

          # Save the script's stdout (the review comment) to GitHub Actions output
          echo "review_comment<<EOF" >> $GITHUB_OUTPUT
          cat review_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          # Pass secrets and potentially large inputs as environment variables
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_TITLE: ${{ steps.pr_metadata.outputs.pr_title }}
          PR_DESCRIPTION: ${{ steps.pr_metadata.outputs.pr_description }}
          PR_DIFF_CONTENT: ${{ steps.pr_diff.outputs.pr_diff_content }}
          CODING_STANDARDS: ${{ steps.coding_standards.outputs.content }}

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = ${{ steps.pr_metadata.outputs.pr_number }};
            const reviewComment = `${{ steps.run_script.outputs.review_comment }}`; // Get stdout from python script step
            const scriptOutcome = '${{ steps.run_script.outcome }}'; // Check if the python script step succeeded or failed

            let commentBody = '';

            if (scriptOutcome === 'failure') {
              commentBody = `⚠️ **AI Review Failed**\n\nCould not generate AI review. The review script encountered an error. Please check the workflow run logs for details.`;
              // Consider adding stderr from the script if captured for more debug info
            } else if (!reviewComment || reviewComment.trim() === '') {
              commentBody = `⚠️ **AI Review Warning**\n\nGemini API returned an empty response or the review script produced no output.`;
            } else {
              commentBody = `## 🤖 AI Pull Request Review\n\n${reviewComment}`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: commentBody
            });