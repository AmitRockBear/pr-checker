name: PR Analysis and Comment

on:
  pull_request:
    types: [opened, synchronize, reopened] # Trigger on open, push to branch, reopen

permissions:
  contents: read       # To checkout the code
  pull-requests: write # IMPORTANT: To post comments on the PR

jobs:
  analyze-and-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Or v3

      - name: Set up Python
        uses: actions/setup-python@v5 # Or v4
        with:
          python-version: '3.x' # Specify your desired Python version

      - name: Install dependencies
        run: pip install requests

      - name: Run PR Analysis Script
        # Assuming your script is named pr_commenter.py and is in the root
        # Adjust the path if necessary, e.g., python ${{ github.workspace }}/.github/scripts/pr-check.py
        run: python ${{ github.workspace }}/.github/scripts/pr-commenter.py
        env:
          # GITHUB_TOKEN is automatically provided with the right permissions
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_REPOSITORY is automatically provided (e.g., owner/repo)
          GITHUB_REPOSITORY: ${{ github.repository }}
          # GITHUB_EVENT_PATH points to the file with the full webhook payload
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          # Extract the PR number from the event payload
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # GITHUB_RUN_ID is automatically provided
          # GITHUB_RUN_ID: ${{ github.run_id }} # Script reads this directly